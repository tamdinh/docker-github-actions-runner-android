services:
  github-runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: "17"
        COMPILE_SDK: "36"
        BUILD_TOOLS: "36.0.0"
        NDK_VERSION: "27.1.12297006"
        CMAKE_VERSION: "3.22.1"
        NODE_VERSION: "22.23.1"
        PNPM_VERSION: "11.9.0"
        EAS_CLI_VERSION: "24.7.0"
    image: ghcr.io/tamdinh/docker-github-actions-runner-android:expo57-node22-android36-v1
    container_name: github-expo-runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNER_NAME: ${RUNNER_NAME:-expo-android-runner}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-/runner/_work}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,linux,x64,expo,android,web,vps}
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-data
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    volumes:
      - runner-data:/runner-data
      - gradle-cache:/root/.gradle
      - maven-cache:/root/.m2
      - npm-cache:/root/.npm
      - pnpm-cache:/root/.local/share/pnpm
      - expo-cache:/root/.expo

volumes:
  runner-data:
  gradle-cache:
  maven-cache:
  npm-cache:
  pnpm-cache:
  expo-cache:
